# Paths in this override are relative to the included app/compose.yaml.
services:
  apex:
    environment:
      APEX_CONFIG: /opt/apex/customization/demo/apex.config.json
      APEX_SHOW_ACCESS: ${APEX_SHOW_ACCESS:-1}
      APEX_CONTROL_MAX_REQUEST_BYTES: ${APEX_CONTROL_MAX_REQUEST_BYTES:-134217728}
    volumes:
      - ../demo/.local/container:/sources/demo:ro
      - ../demo/sources.json:/opt/apex/customization/demo/adapter/sources.json:ro
