[workspace]
resolver = "3"
members = ["core", "middleware/control", "middleware/data", "middleware/api", "ui/desktop"]
default-members = [".", "core", "middleware/control", "middleware/data", "middleware/api"]

[workspace.package]
version = "1.0.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
schemars = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[package]
name = "apex-scheduler"
version.workspace = true
edition.workspace = true
publish = false
description = "Agent-facing discrete production scheduler"
license-file = "LICENSE"

[lib]
name = "apex"
path = "lib.rs"

[[bin]]
name = "apex"
path = "middleware/api/cli.rs"

[dependencies]
apex-engine = { path = "core" }
apex-control = { path = "middleware/control" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
fs2 = "0.4"
tiny_http = "0.12"
schemars.workspace = true

[profile.release]
lto = "thin"
codegen-units = 1

[lints]
workspace = true
