name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
      base: ${{ steps.scope.outputs.base }}
      target: ${{ steps.scope.outputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: scope
        run: python -B dev/scripts/ci_plan.py

  rust:
    name: Rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    defaults:
      run:
        working-directory: app
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        id: toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default stable
          echo "key=$(rustc --version | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore Cargo dependencies and build cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('app/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('app/Cargo.lock') }}-
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: Lint, test and build
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked --release
      - name: Lint and test the desktop display client
        if: runner.os == 'macOS'
        run: |
          cargo clippy --locked -p apex-desktop --all-targets -- -D warnings
          cargo test --locked -p apex-desktop
      - name: Install Node for Linux integration
        if: runner.os == 'Linux'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install integration dependencies
        if: runner.os == 'Linux'
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: MCP and HTTP integration
        if: runner.os == 'Linux'
        run: |
          npm run test:mcp
          npm run test:http
          npm run test:config
          npm run test:mcp-app
          npm run test:control
      - name: Viewer integration using the same release executable
        if: runner.os == 'Linux'
        run: |
          target/release/apex serve --port 8765 > "$RUNNER_TEMP/apex-viewer.log" 2>&1 &
          viewer_pid=$!
          trap 'kill "$viewer_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then
              break
            fi
            if ! kill -0 "$viewer_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/apex-viewer.log"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8765/ > /dev/null
          npm run test:viewer
          node tests/viewer-plan-smoke.mjs
      - name: Save trusted Cargo cache
        if: github.event_name == 'push' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  publication:
    name: Source publication
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Demo MES workflows and language templates
        run: |
          python -B -m unittest discover -s demo/mes/tests -v
          for source in demo/mes/web/*.js demo/mes/web/locales/*.js; do
            node --check "$source"
          done
          node demo/mes/tests/i18n.mjs
      - name: Contributor tests, documentation and skill consistency
        run: |
          python -B -m unittest discover -s dev/tests -p 'test_*.py' -v
          python -B dev/scripts/sync_skills.py --check
          python -B dev/scripts/check_docs.py
          python -B dev/scripts/build_wiki.py
          python -B dev/scripts/check_publication.py
      - name: Check the product version and release boundary
        env:
          BASE_REVISION: ${{ needs.changes.outputs.base }}
          TARGET_BRANCH: ${{ needs.changes.outputs.target }}
        run: python -B dev/scripts/release.py check --base "$BASE_REVISION" --target "$TARGET_BRANCH"

  control-postgres:
    name: Control platform on PostgreSQL
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: apex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Store conformance and row-level security
        env:
          APEX_TEST_DATABASE_URL: postgres://postgres:apex@127.0.0.1:5432/postgres
        run: cargo test --locked -p apex-control-postgres

  standalone:
    name: Standalone application
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Build and run using only the application source
        run: python -B dev/scripts/check_standalone.py

  containers:
    name: Standalone and demo containers
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Start, plan and recreate both deployments
        run: python -B dev/scripts/check_containers.py

  required:
    name: Required checks
    if: ${{ always() }}
    needs: [changes, rust, control-postgres, publication, standalone, containers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all applicable checks
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          RUNTIME_REQUIRED: ${{ needs.changes.outputs.runtime }}
          RUST_RESULT: ${{ needs.rust.result }}
          POSTGRES_RESULT: ${{ needs.control-postgres.result }}
          PUBLICATION_RESULT: ${{ needs.publication.result }}
          STANDALONE_RESULT: ${{ needs.standalone.result }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$PUBLICATION_RESULT" = success
          if test "$RUNTIME_REQUIRED" = true; then
            test "$RUST_RESULT" = success
            test "$POSTGRES_RESULT" = success
            test "$STANDALONE_RESULT" = success
            test "$CONTAINERS_RESULT" = success
          elif test "$RUNTIME_REQUIRED" = false; then
            test "$RUST_RESULT" = skipped
            test "$POSTGRES_RESULT" = skipped
            test "$STANDALONE_RESULT" = skipped
            test "$CONTAINERS_RESULT" = skipped
          else
            exit 1
          fi
